name: Test and deploy to AWS Fargate

on:
  push:
    branches: [main]
  pull_request:        # run the tests on PRs, but never deploy from one
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  id-token: write      # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rag-api
  ECS_CLUSTER: rag-cluster
  ECS_SERVICE: rag-api-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 3.11, not 3.12: llama-index-postprocessor-cohere-rerank on the 0.1.x
      # line — the line compatible with llama-index-core 0.10.x — requires
      # Python < 3.12.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          # config.py reads OPENAI_API_KEY with os.environ[...] at import time,
          # so it must be present or collection fails. The value is never used:
          # the query engine and the intent classifier are mocked, and no test
          # reaches the network.
          OPENAI_API_KEY: sk-dummy-value-tests-mock-all-network-calls
          # Startup refuses placeholder auth credentials unless told the
          # context is safe. It is safe here: nothing this job serves is
          # reachable.
          ALLOW_INSECURE_AUTH: "true"
        run: pytest tests/ -v

  deploy:
    # Gate the deploy on a green suite. Without this the tests are advisory
    # and the suite drifts back to red, which is how it reached 42 collection
    # errors before.
    needs: test
    # Pull requests run the tests above but must not deploy; this still allows
    # push-to-main and manual workflow_dispatch runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::114154619698:role/github-actions-rag-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 -f Dockerfile.api \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Trigger Fargate deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
